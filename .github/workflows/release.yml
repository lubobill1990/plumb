name: Release

# Push a tag like v0.2.0 (matching "version" in src-tauri/tauri.conf.json) to publish
# a GitHub Release with the Windows installer attached.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Plumb ${{ github.ref_name }}
          releaseBody: |
            Windows installer (NSIS). The app is not code-signed yet, so SmartScreen may
            warn on first launch: click "More info" -> "Run anyway".
          releaseDraft: false
          prerelease: false
