name: Release

# Push a tag like v0.2.0 (matching "version" in src-tauri/tauri.conf.json) to publish a
# GitHub Release for Windows, macOS and Linux, with updater signatures and one latest.json.
#
# Windows code signing (Authenticode) is done by SignPath (free for OSS, certificate by SignPath
# Foundation) once the repo variable SIGNPATH_ORGANIZATION_ID is set; until then the
# release is published unsigned. See docs/code-signing.md.
#
# Order matters:
#   1. build plumb.exe
#   2. bundle once: Tauri's bundler patches the bundle type into a copy of the exe; take
#      that patched exe out of the installer
#   3. Authenticode-sign it (SignPath; a manual approval in SignPath for every release)
#   4. bundle again from the signed exe: the patch rewrites identical bytes, so the
#      embedded plumb.exe keeps its signature
#   5. Authenticode-sign the installer (second approval)
#   6. (publish job) minisign-sign every final package for the in-app updater, write
#      latest.json, publish. macOS / Linux jobs: see below.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to (re)publish, e.g. v0.1.2 (must match the version)
        required: true
      dry_run:
        description: Build and sign everything from this branch, but upload the files as a workflow artifact instead of publishing
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # (not named SIGN: linuxdeploy's appimage plugin GPG-signs whenever $SIGN is set)
  SIGNPATH_SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
  BUNDLE_CONFIG: '{"bundle":{"createUpdaterArtifacts":false}}'

jobs:
  windows:
    runs-on: windows-latest
    # two manual SignPath approvals may sit in the queue for a while
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dry_run && github.sha || env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Version must match the tag
        id: v
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne $env:TAG) { throw "tag $env:TAG does not match version $v in tauri.conf.json" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "installer=Plumb_${v}_x64-setup.exe" >> $env:GITHUB_OUTPUT

      - name: Build plumb.exe
        run: npx tauri build --ci --no-bundle

      - name: Bundle once (patches the bundle type into the exe)
        run: npx tauri bundle --ci --bundles nsis --config $env:BUNDLE_CONFIG

      - name: Take the patched exe out of the installer
        run: |
          $installer = "src-tauri/target/release/bundle/nsis/${{ steps.v.outputs.installer }}"
          7z x -y -ounpacked $installer plumb.exe | Out-Null
          New-Item -ItemType Directory -Force to-sign/exe | Out-Null
          Copy-Item unpacked/plumb.exe to-sign/exe/plumb.exe

      # ---- Authenticode: plumb.exe ----
      - name: Upload exe for signing
        if: env.SIGNPATH_SIGN == 'true'
        id: up-exe
        uses: actions/upload-artifact@v4
        with:
          name: plumb-exe-unsigned
          path: to-sign/exe/plumb.exe
          if-no-files-found: error

      - name: Sign plumb.exe (SignPath)
        if: env.SIGNPATH_SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'plumb' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.up-exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: signed/exe
          parameters: |
            version: "${{ steps.v.outputs.version }}"

      - name: Put the signed exe back
        if: env.SIGNPATH_SIGN == 'true'
        run: |
          $s = Get-AuthenticodeSignature signed/exe/plumb.exe
          if ($s.Status -ne 'Valid') { throw "signed plumb.exe: $($s.Status) $($s.StatusMessage)" }
          "signed by: $($s.SignerCertificate.Subject)"
          Copy-Item signed/exe/plumb.exe src-tauri/target/release/plumb.exe -Force

      - name: Bundle the installer
        run: |
          Remove-Item src-tauri/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue
          npx tauri bundle --ci --bundles nsis --config $env:BUNDLE_CONFIG
          if ($env:SIGNPATH_SIGN -eq 'true') {
            # the embedded exe must still carry its signature
            Remove-Item unpacked -Recurse -Force -ErrorAction SilentlyContinue
            7z x -y -ounpacked "src-tauri/target/release/bundle/nsis/${{ steps.v.outputs.installer }}" plumb.exe | Out-Null
            $s = Get-AuthenticodeSignature unpacked/plumb.exe
            if ($s.Status -ne 'Valid') { throw "plumb.exe inside the installer: $($s.Status)" }
          }
          New-Item -ItemType Directory -Force to-sign/installer | Out-Null
          Copy-Item "src-tauri/target/release/bundle/nsis/${{ steps.v.outputs.installer }}" to-sign/installer/

      # ---- Authenticode: the installer ----
      - name: Upload installer for signing
        if: env.SIGNPATH_SIGN == 'true'
        id: up-installer
        uses: actions/upload-artifact@v4
        with:
          name: plumb-installer-unsigned
          path: to-sign/installer/${{ steps.v.outputs.installer }}
          if-no-files-found: error

      - name: Sign the installer (SignPath)
        if: env.SIGNPATH_SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'plumb' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.up-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 18000
          output-artifact-directory: signed/installer
          parameters: |
            version: "${{ steps.v.outputs.version }}"

      - name: Collect the release files
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          $src = if ($env:SIGNPATH_SIGN -eq 'true') { 'signed/installer' } else { 'to-sign/installer' }
          Copy-Item "$src/${{ steps.v.outputs.installer }}" dist-release/
          $s = Get-AuthenticodeSignature "dist-release/${{ steps.v.outputs.installer }}"
          "installer signature: $($s.Status) $($s.SignerCertificate.Subject)"
          if ($env:SIGNPATH_SIGN -eq 'true' -and $s.Status -ne 'Valid') { throw "installer not validly signed" }

      - name: Keep the Windows files for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist-release/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS: one universal .app (Apple Silicon + Intel), signed with the Developer ID of
  # Suzhou Zhishi Miaoyan Software Technology Co., Ltd when the APPLE_* secrets are set
  # (scripts: D:\certs\set-plumb-apple-secrets.sh). Notarization runs separately with a
  # 20-minute limit (Apple's queue has stalled for hours on this account): accepted ->
  # stapled; timed out -> shipped signed but not notarized ("Open Anyway").
  # ---------------------------------------------------------------------------
  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      HAS_APPLE: ${{ secrets.APPLE_DEVELOPER_ID_APP_P12 != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_NOTARY_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dry_run && github.sha || env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Version must match the tag
        id: v
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "v$v" = "$TAG" ] || { echo "tag $TAG does not match version $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build + sign (Developer ID)
        if: env.HAS_APPLE == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_APP_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APP_P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "${{ vars.APPLE_SIGNING_IDENTITY || 'Developer ID Application: Suzhou Zhishi Miaoyan Software Technology Co., Ltd (QTKH7M6UMC)' }}"
        run: npx tauri build --ci --target universal-apple-darwin --bundles app,dmg --config "$BUNDLE_CONFIG"

      - name: Build (unsigned - no APPLE_* secrets yet)
        if: env.HAS_APPLE != 'true'
        run: npx tauri build --ci --target universal-apple-darwin --bundles app,dmg --config "$BUNDLE_CONFIG"

      - name: Notarize (20 min limit) + staple
        if: env.HAS_APPLE == 'true' && env.HAS_NOTARY == 'true'
        env:
          P8: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          b=src-tauri/target/universal-apple-darwin/release/bundle
          dmg=$(ls $b/dmg/*.dmg)
          printf '%s' "$P8" > "$RUNNER_TEMP/notary.p8"
          if xcrun notarytool submit "$dmg" --key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" --issuer "$ISSUER" \
               --wait --timeout 20m --output-format json | tee "$RUNNER_TEMP/notary.json" | grep -q '"status" *: *"Accepted"'; then
            xcrun stapler staple "$dmg"
            xcrun stapler staple "$b/macos/Plumb.app"
            echo "NOTARIZED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::notarization did not finish in 20 minutes (or was rejected); shipping signed but not notarized"
            cat "$RUNNER_TEMP/notary.json" || true
          fi
          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Check the signature
        if: env.HAS_APPLE == 'true'
        run: |
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Plumb.app
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E 'Authority|TeamIdentifier'
          spctl -a -vv "$app" || echo "(Gatekeeper: not notarized yet)"

      - name: Collect the macOS files
        run: |
          v=${{ steps.v.outputs.version }}
          b=src-tauri/target/universal-apple-darwin/release/bundle
          mkdir -p dist-release
          cp "$(ls $b/dmg/*.dmg)" "dist-release/Plumb_${v}_universal.dmg"
          # the in-app updater's package: the (stapled) .app
          tar -czf "dist-release/Plumb_${v}_universal.app.tar.gz" -C "$b/macos" Plumb.app
          echo "macos-signed=$HAS_APPLE notarized=${NOTARIZED:-false}" > dist-release/macos-status.txt
          ls -la dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist-release/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Linux: AppImage (self-updating) + deb (updated through the package manager)
  # ---------------------------------------------------------------------------
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dry_run && github.sha || env.TAG }}

      - name: System libraries (webkit2gtk, gtk)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Version must match the tag
        id: v
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "v$v" = "$TAG" ] || { echo "tag $TAG does not match version $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          # linuxdeploy: its strip chokes on newer libraries; no FUSE needed for its own AppImages
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        # linuxdeploy fails intermittently; one retry, verbose so a failure says why
        run: npx tauri build --ci --verbose --bundles appimage,deb --config "$BUNDLE_CONFIG" || npx tauri build --ci --verbose --bundles appimage,deb --config "$BUNDLE_CONFIG"

      - name: Collect the Linux files
        run: |
          v=${{ steps.v.outputs.version }}
          b=src-tauri/target/release/bundle
          mkdir -p dist-release
          cp "$(ls $b/appimage/*.AppImage)" "dist-release/Plumb_${v}_amd64.AppImage"
          cp "$(ls $b/deb/*.deb)" "dist-release/Plumb_${v}_amd64.deb"
          ls -la dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist-release/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Updater signatures (minisign, made last: Authenticode / notarization change bytes),
  # one latest.json for every platform, publish.
  # ---------------------------------------------------------------------------
  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.dry_run && github.sha || env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist-release
          merge-multiple: true

      - name: Updater signatures + latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd dist-release
          v=${TAG#v}
          win="Plumb_${v}_x64-setup.exe"
          mac="Plumb_${v}_universal.app.tar.gz"
          lin="Plumb_${v}_amd64.AppImage"
          for f in "$win" "$mac" "$lin"; do
            [ -f "$f" ] || { echo "missing $f"; exit 1; }
            npx tauri signer sign "$f"
            [ -f "$f.sig" ] || { echo "no updater signature for $f"; exit 1; }
          done
          url="https://github.com/${{ github.repository }}/releases/download/$TAG"
          WIN="$win" MAC="$mac" LIN="$lin" URL="$url" V="$v" node -e '
            const fs = require("fs");
            const e = process.env;
            const entry = (f) => ({ signature: fs.readFileSync(f + ".sig", "utf8").trim(), url: e.URL + "/" + f });
            const manifest = {
              version: e.V,
              notes: "Plumb v" + e.V,
              pub_date: new Date().toISOString().replace(/\.\d+Z$/, "Z"),
              platforms: {
                "windows-x86_64": entry(e.WIN),
                "darwin-aarch64": entry(e.MAC),
                "darwin-x86_64": entry(e.MAC),
                "linux-x86_64": entry(e.LIN),
              },
            };
            fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2) + "\n");
          '
          cat latest.json
          ls -la

      - name: Dry run - keep the files as an artifact
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist-release/

      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist-release
          mac_status=$(cat macos-status.txt); rm -f macos-status.txt
          win_note='Windows: NSIS per-user installer'
          [ "$SIGNPATH_SIGN" = "true" ] && win_note="$win_note, code-signed (certificate by SignPath Foundation)" || win_note="$win_note, not code-signed yet (SmartScreen: More info -> Run anyway)"
          case "$mac_status" in
            *macos-signed=true*notarized=true*) mac_note='macOS: universal dmg, signed (Developer ID: Suzhou Zhishi Miaoyan Software Technology Co., Ltd) and notarized' ;;
            *macos-signed=true*) mac_note='macOS: universal dmg, signed (Developer ID: Suzhou Zhishi Miaoyan Software Technology Co., Ltd), notarization pending: first launch via System Settings > Privacy & Security > Open Anyway' ;;
            *) mac_note='macOS: universal dmg, not signed yet: run xattr -cr /Applications/Plumb.app once after copying it' ;;
          esac
          notes=$(printf '%s\n\n- %s\n- %s\n- Linux: AppImage (updates itself) and deb\n\nInstalled copies offer this update in the title bar.' "Plumb $TAG" "$win_note" "$mac_note")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ./* --clobber
          else
            gh release create "$TAG" ./* --title "Plumb $TAG" --notes "$notes" --verify-tag
          fi
