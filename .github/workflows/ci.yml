name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows build + tests
            os: windows-latest
            bundles: nsis
            artifact: src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS build + tests (universal)
            os: macos-latest
            bundles: app,dmg
            target: universal-apple-darwin
            artifact: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Linux build + tests
            os: ubuntu-22.04
            bundles: appimage,deb
            artifact: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries (webkit2gtk, gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.os }}

      - name: Install frontend deps
        run: npm ci

      - name: Typecheck + build frontend
        run: npm run build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Bundle
        shell: bash
        # PRs have no signing key: skip the updater artifacts (.sig / latest.json) here
        run: npx tauri build --ci --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }} --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: plumb-${{ runner.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
