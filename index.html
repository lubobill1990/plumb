<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Terminal</title>
  </head>
  <body>
    <div id="titlebar" data-tauri-drag-region>
      <div id="tabs" data-tauri-drag-region></div>
      <button id="new-tab" class="flat" title="新标签 (Ctrl+Shift+T)">&#xE710;</button>
      <button id="launch-menu" class="flat" title="选择配置和启动目录">&#xE70D;</button>
      <div class="spacer" data-tauri-drag-region></div>
      <button id="repaint" class="flat icon" title="重绘画面 (Ctrl+Shift+R)" aria-label="重绘画面">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 13.5H3A1.5 1.5 0 0 1 1.5 12V4A1.5 1.5 0 0 1 3 2.5h10A1.5 1.5 0 0 1 14.5 4v2.5" />
          <path d="M4 5.5h4M4 8h2.5" />
          <path d="M14.5 11.5a3 3 0 1 1-3-3" />
          <path d="M10.6 7.2l1.3 1.3-1.3 1.3" />
        </svg>
      </button>
      <div id="win-controls">
        <button id="win-min" title="最小化">&#xE921;</button>
        <button id="win-max" title="最大化">&#xE922;</button>
        <button id="win-close" title="关闭">&#xE8BB;</button>
      </div>
    </div>
    <div id="terminals"></div>
    <div id="launcher" class="menu" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
